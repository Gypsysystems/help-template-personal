<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synergy Home &mdash; Interactive Wireframe</title>
<style>
  /* ================= Presight brand tokens ================= */
  :root{
    --sky:#00A3FF;          /* Sky - callouts as printed */
    --sky-deep:#0700C4;     /* Spectrum dark blue - selected callout */
    --shadow:#404040;
    --white:#FFFFFF;
    --line:#E6E8EB;
    --line-soft:#EEF1F4;
    --muted:#6B6F73;
    --font:"Aptos","Arial",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}

  /* =================================================================
     FIXED FRAME
     The page itself never scrolls. The walkthrough fills the available
     height and only the individual panes scroll internally.
     No 100vh is used anywhere - the frame inherits its height from
     html/body, so it behaves correctly inside a Flare iframe.
     ================================================================= */
  html,body{
    height:100%;
    overflow:hidden;
    margin:0;
    padding:0;
  }
  body{
    font-family:var(--font);
    color:var(--shadow);
    background:var(--white);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    height:100%;
    display:flex;
    flex-direction:column;
    max-width:1120px;
    margin:0 auto;
    padding:20px 24px 24px;
  }

  /* Header keeps its natural height */
  .app__header{flex:0 0 auto;margin-bottom:14px;}
  .app__title{font-size:23px;font-weight:700;margin:0 0 3px;letter-spacing:-0.2px;}
  .app__subtitle{font-size:14px;color:var(--muted);margin:0;}

  /* =================================================================
     TWO-PANE ROW
     min-height:0 is essential - without it the flex children refuse to
     shrink and stretch the page instead of scrolling.
     ================================================================= */
  .layout{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    gap:24px;
    align-items:stretch;
  }
  .col--stage{flex:0 0 70%;max-width:70%;min-height:0;display:flex;}
  .col--panel{flex:0 0 30%;max-width:30%;min-height:0;display:flex;}

  /* ================= Left pane - the only scrolling area =========== */
  .stage{
    position:relative;
    width:100%;
    min-height:0;
    overflow-y:auto;              /* screenshot scrolls inside its own window */
    overflow-x:hidden;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--white);
  }
  /* Wrapper establishes the positioning context that scrolls with the
     image, so percentage-positioned markers stay locked to it. */
  .stage__inner{position:relative;width:100%;}
  .stage__img{display:block;width:100%;height:auto;}

  /* =================================================================
     SELECTED / HOVERED CALLOUT
     The numbered markers are already printed in the screenshot. A
     pre-rendered overlay traced to the pin outline is placed exactly
     over the printed pin, recoloured from Sky (#00A3FF) to Presight
     dark blue (#0700C4). The white numeral is preserved and the
     underlying screenshot is never modified.
     ================================================================= */
  .pin{
    position:absolute;
    display:block;
    opacity:0;
    pointer-events:none;
    z-index:1;
    transition:opacity .12s ease;
  }
  .pin.is-active,
  .pin.is-hot{opacity:1;}

  /* ================= Hotspots (transparent, over printed pins) ===== */
  .hotspot{
    position:absolute;
    transform:translate(-50%,-50%);
    width:5.2%;
    aspect-ratio:1 / 1;
    border-radius:50%;
    background:transparent;
    border:0;
    padding:0;
    cursor:pointer;
    z-index:2;
  }
  /* No ring on hover or focus - the printed pin turns dark blue instead. */
  .hotspot:hover{outline:none;}
  .hotspot:focus-visible{outline:none;}

  /* =================================================================
     RIGHT PANE - fixed in place, never moves
     Splits into a scrolling description area and a pinned button row.
     ================================================================= */
  .panel{
    display:flex;
    flex-direction:column;
    width:100%;
    min-height:0;
  }
  .panel__head{flex:0 0 auto;}
  .panel__eyebrow{font-size:16px;font-weight:700;margin:0 0 6px;}
  .panel__intro{
    font-size:13.5px;color:var(--muted);margin:0 0 16px;
    padding-bottom:14px;border-bottom:1px solid var(--line-soft);
  }

  /* Only the description scrolls when a step runs long */
  .panel__body{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding-right:8px;
  }

  .detail__badge-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .detail__num{
    flex:0 0 auto;width:28px;height:28px;border-radius:50%;
    background:var(--sky-deep);color:var(--white);font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .detail__name{font-size:17px;font-weight:700;margin:0;}
  .detail__section{margin:14px 0 0;}
  .detail__label{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
    color:var(--sky);margin:0 0 3px;
  }
  .detail__text{font-size:14px;margin:0;}

  /* Button row pinned to the TOP of the pane so the controls are always
     in the same place and never require scrolling to reach. */
  .nav{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;padding-bottom:14px;
    border-bottom:1px solid var(--line-soft);
  }
  .nav__btn{
    font-family:var(--font);font-size:13.5px;font-weight:600;
    color:var(--sky);background:var(--white);
    border:1px solid var(--sky);border-radius:6px;
    padding:8px 16px;cursor:pointer;
    transition:background .12s ease,color .12s ease,opacity .12s ease;
  }
  .nav__btn:hover:not(:disabled){background:var(--sky);color:var(--white);}
  .nav__btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(0,163,255,.40);}
  .nav__btn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--muted);}
  .nav__progress{font-size:13px;font-weight:600;color:var(--sky);}

  /* =================================================================
     NARROW SCREENS - two panes do not fit, so fall back to a normal
     stacked single column that scrolls the page as usual.
     ================================================================= */
  @media (max-width:900px){
    html,body{height:auto;overflow:visible;}
    .app{height:auto;display:block;}
    .layout{display:block;min-height:0;}
    .col--stage,.col--panel{max-width:100%;display:block;}
    .stage{overflow:visible;}
    .panel{display:block;margin-top:16px;}
    .panel__body{overflow:visible;padding-right:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .pin{transition:none;}
  }
</style>
</head>

/* =====================================================================
   PRESENTATION LOGIC
   ===================================================================== */
(function(){
  const stage    = document.getElementById('stage');
  const inner    = document.getElementById('stageInner');
  const detail   = document.getElementById('detail');
  const progress = document.getElementById('progress');
  const prevBtn  = document.getElementById('prevBtn');
  const nextBtn  = document.getElementById('nextBtn');

  let current = 0;
  const spots = [];
  const pins  = [];

  CALLOUTS.forEach(function(c, i){
    // dark-blue overlay used for the selected / hovered state
    const p = document.createElement('img');
    p.className = 'pin';
    p.src = c.pin.src;
    p.alt = '';
    p.setAttribute('aria-hidden','true');
    p.style.left  = c.pin.left + '%';
    p.style.top   = c.pin.top  + '%';
    p.style.width = c.pin.w    + '%';
    inner.appendChild(p);
    pins.push(p);

    // transparent clickable hotspot over the printed marker
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'hotspot';
    b.style.left = c.x + '%';
    b.style.top  = c.y + '%';
    b.setAttribute('aria-label', 'Callout ' + c.id + ': ' + c.name);
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function(){ select(i, true); });
    b.addEventListener('mouseenter', function(){ hot(i, true);  });
    b.addEventListener('mouseleave', function(){ hot(i, false); });
    b.addEventListener('focus',      function(){ hot(i, true);  });
    b.addEventListener('blur',       function(){ hot(i, false); });
    inner.appendChild(b);
    spots.push(b);
  });

  function hot(i, on){ pins[i].classList.toggle('is-hot', on); }

  function renderDetail(c){
    detail.innerHTML =
      '<div class="detail__badge-row">' +
        '<span class="detail__num">' + c.id + '</span>' +
        '<h3 class="detail__name">' + c.name + '</h3>' +
      '</div>' +
      '<div class="detail__section">' +
        '<p class="detail__label">What it is</p>' +
        '<p class="detail__text">' + c.explanation + '</p>' +
      '</div>' +
      '<div class="detail__section">' +
        '<p class="detail__label">What you can do</p>' +
        '<p class="detail__text">' + c.action + '</p>' +
      '</div>';
    detail.scrollTop = 0;
  }

  /* Scroll the marker into view *within the left pane only*, so the
     right-hand pane and its buttons never move. */
  function revealInPane(el){
    const paneH = stage.clientHeight;
    const target = el.offsetTop - (paneH / 2);
    const max = stage.scrollHeight - paneH;
    const top = Math.max(0, Math.min(target, max));
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stacked = window.matchMedia('(max-width: 900px)').matches;
    if(stacked){
      el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'center'});
    } else {
      stage.scrollTo({top: top, behavior: reduce ? 'auto' : 'smooth'});
    }
  }

  function select(i, fromClick){
    current = i;
    pins.forEach(function(p, idx){ p.classList.toggle('is-active', idx === i); });
    spots.forEach(function(s, idx){
      s.setAttribute('aria-pressed', idx === i ? 'true' : 'false');
    });
    renderDetail(CALLOUTS[i]);
    progress.textContent = (i + 1) + ' of ' + CALLOUTS.length;
    prevBtn.disabled = (i === 0);
    nextBtn.disabled = (i === CALLOUTS.length - 1);
    if(!fromClick) revealInPane(spots[i]);
  }

  prevBtn.addEventListener('click', function(){ if(current > 0) select(current - 1); });
  nextBtn.addEventListener('click', function(){ if(current < CALLOUTS.length - 1) select(current + 1); });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' && current < CALLOUTS.length - 1) select(current + 1);
    if(e.key === 'ArrowLeft'  && current > 0)                   select(current - 1);
  });

  select(0, true);   // auto-select callout 1 on load
})();
</script>
